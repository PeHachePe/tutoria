# Runs the same checks as `npm run check` on every push to master and every pull request:
# formatting, lint, app unit tests with 100 % coverage (D-010) and the scripts' tests; then the
# end-to-end tests with axe against the simulated data (D-011, step 0.6).
name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Against the `demo` build, served as static files (step 1.1e, D-025)
      - run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
