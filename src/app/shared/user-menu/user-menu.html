<button
  matIconButton
  type="button"
  aria-label="Menú de usuario"
  i18n-aria-label="@@userMenu.button"
  matTooltip="Menú de usuario"
  i18n-matTooltip="@@userMenu.tooltip"
  [matMenuTriggerFor]="menu"
>
  <mat-icon>account_circle</mat-icon>
</button>

<mat-menu #menu="matMenu" xPosition="before">
  @if (user(); as user) {
    <div class="flex flex-col px-4 py-2">
      <span class="text-title-small">{{ user.name }}</span>
      <span class="text-body-small text-on-surface-variant">{{ user.email }}</span>
    </div>
    <mat-divider />
  }

  @for (link of links(); track link.path) {
    <a mat-menu-item [routerLink]="link.path">
      <mat-icon>{{ link.icon }}</mat-icon>
      <span>{{ link.label }}</span>
    </a>
  }
  @if (links().length) {
    <mat-divider />
  }

  <button mat-menu-item type="button" (click)="signOut()">
    <mat-icon>logout</mat-icon>
    <span i18n="@@userMenu.signOut">Cerrar sesión</span>
  </button>
</mat-menu>
