<app-skip-link />

<header>
  <mat-toolbar class="gap-2">
    <app-brand />
    <nav aria-label="Principal" i18n-aria-label="@@nav.main" class="flex-1">
      <ul class="flex">
        <li>
          <a
            [routerLink]="catalogPath"
            [attr.aria-current]="onCatalog() ? 'page' : null"
            [class]="inExercises() ? 'underline decoration-2 underline-offset-8' : ''"
            class="rounded-md px-3 py-2 text-label-large"
            i18n="@@nav.catalog"
          >
            Ejercicios
          </a>
        </li>
      </ul>
    </nav>
    <app-theme-menu />
    <app-language-menu />
    <app-user-menu [links]="accountLinks" />
  </mat-toolbar>
</header>

<main
  id="contenido"
  tabindex="-1"
  class="mx-auto w-full px-4 py-6 routed-pages outline-none sm:px-6"
  [class]="onExercise() ? widePageClass : readingPageClass"
>
  <router-outlet />
</main>
